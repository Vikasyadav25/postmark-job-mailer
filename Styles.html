<style>
  :root {
    --ink: #263a34;
    --muted: #777e75;
    --green: #315b48;
    --green-dark: #244836;
    --paper: #f6f7f2;
    --border: #e3e7de;
    --soft: #ecf0e7;
    --white: #fff;
    --serif: Georgia, "Times New Roman", serif;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  button,
  input,
  textarea {
    font: inherit;
  }
  button,
  a,
  input,
  textarea {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    cursor: wait;
    opacity: 0.55;
  }
  a {
    color: inherit;
  }
  button:focus-visible,
  a:focus-visible {
    outline: 3px solid #a0b69b;
    outline-offset: 4px;
  }
  input:focus,
  textarea:focus {
    outline: 2px solid #98ad91;
    outline-offset: 2px;
  }
  input,
  textarea {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    background: #fff;
    color: var(--ink);
    font-size: 16px;
  }
  input::placeholder,
  textarea::placeholder {
    color: #9da398;
  }
  textarea {
    resize: vertical;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin: 20px 0 8px;
  }
  h1,
  h2,
  h3,
  p {
    margin: 0;
  }
  h2 {
    font-size: 23px;
    font-weight: 500;
    line-height: 1.35;
    font-family: var(--serif);
  }
  h3 {
    font-size: 18px;
    font-family: var(--serif);
    font-weight: 500;
  }
  [hidden] {
    display: none !important;
  }
  .app-shell {
    max-width: 1240px;
    margin: auto;
    padding: 0 52px;
  }
  .topbar {
    height: 96px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -1.3px;
    text-decoration: none;
  }
  .brand-dot {
    color: #7e996b;
    margin-left: -10px;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--green);
    color: #fff;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .private-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #79906a;
    flex-shrink: 0;
  }
  .page-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 48px 0 34px;
  }
  .eyebrow,
  .section-label {
    font-size: 10px;
    letter-spacing: 1.7px;
    font-weight: 650;
    color: #7a8474;
  }
  .eyebrow {
    margin-bottom: 15px;
  }
  h1 {
    font-family: var(--serif);
    font-size: 48px;
    line-height: 1.13;
    letter-spacing: -1.8px;
    font-weight: 400;
  }
  h1 > span {
    color: #8a9b70;
  }
  .intro {
    color: var(--muted);
    margin-top: 17px;
    font-size: 13px;
  }
  .chapter-art {
    position: relative;
    width: 220px;
    height: 164px;
    margin-right: 34px;
  }
  .art-orbit {
    position: absolute;
    width: 200px;
    height: 118px;
    border: 1px solid #dce3d2;
    border-radius: 50%;
    transform: rotate(-26deg);
    left: 0;
    top: 25px;
  }
  .art-envelope {
    position: absolute;
    left: 40px;
    top: 42px;
    width: 126px;
    height: 88px;
    border-radius: 7px;
    background: #e8eddf;
    border: 1px solid #d7dfc9;
    transform: rotate(-12deg);
    display: grid;
    place-items: center;
    box-shadow: 0 12px 24px #52664509;
  }
  .art-envelope:before {
    content: "";
    position: absolute;
    width: 87px;
    height: 87px;
    border-right: 1px solid #cbd5bf;
    border-bottom: 1px solid #cbd5bf;
    transform: rotate(45deg);
    top: -47px;
    border-radius: 0 0 8px 0;
  }
  .art-envelope > span {
    z-index: 1;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 25px;
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    position: absolute;
    bottom: -13px;
    right: -16px;
    transform: rotate(12deg);
  }
  .art-star {
    position: absolute;
    right: 14px;
    top: 10px;
    color: #99a67c;
    font-size: 34px;
  }
  .tabs {
    display: flex;
    gap: 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .tab {
    border: 0;
    background: transparent;
    padding: 14px 0;
    color: var(--muted);
    font-size: 13px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    min-height: 48px;
  }
  .tab.active {
    color: var(--green);
    border-bottom-color: var(--green);
    font-weight: 600;
  }
  .tab > span {
    margin-left: 9px;
  }
  .compose-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.3fr);
    gap: 24px;
    align-items: start;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 3px 9px #24352a02;
  }
  .recipient-card {
    padding: 26px;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 9px;
    letter-spacing: 1.4px;
  }
  .step {
    display: inline-grid;
    place-items: center;
    width: 23px;
    height: 23px;
    border: 1px solid #dce3d4;
    border-radius: 50%;
    font-size: 9px;
    letter-spacing: 0;
    color: #65775b;
  }
  .recipient-card h2 {
    margin: 19px 0 7px;
  }
  .muted {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }
  .required {
    color: #82946c;
  }
  .optional {
    font-weight: 400;
    color: #9da394;
    font-size: 10px;
    margin-left: 4px;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field-hint {
    font-size: 11px;
    line-height: 1.7;
    color: var(--muted);
    margin-top: 13px;
  }
  .resume-card {
    padding: 22px 26px;
    margin-top: 18px;
  }
  .resume-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .text-button {
    background: none;
    border: 0;
    color: var(--green);
    font-size: 11px;
    padding: 9px 0;
    min-height: 40px;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px 0 14px;
  }
  .pdf-icon {
    width: 35px;
    height: 42px;
    border: 1px solid #dde3d8;
    border-radius: 5px;
    background: #f5f7f1;
    color: #7c876f;
    display: inline-grid;
    place-items: center;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .file-details {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .file-details strong {
    font-size: 12px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .file-details > span {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }
  .file-check {
    margin-left: auto;
    border-radius: 50%;
    background: #edf2e6;
    color: #62804f;
    font-size: 12px;
    width: 22px;
    height: 22px;
    text-align: center;
  }
  .attachment-note {
    font-size: 10px;
    color: #8a9183;
    border-top: 1px solid #f0f1ed;
    padding-top: 12px;
  }
  .attachment-note > span {
    margin-right: 5px;
  }
  .quiet-note {
    display: flex;
    gap: 12px;
    padding: 23px 14px;
    color: #8a9180;
  }
  .quiet-note > span {
    font-size: 22px;
  }
  .quiet-note p {
    font-size: 11px;
    line-height: 1.8;
  }
  .email-card {
    overflow: hidden;
  }
  .email-card-heading {
    padding: 22px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #edf0e8;
  }
  .editable-badge {
    padding: 4px 8px;
    border-radius: 4px;
    background: #f1f4ec;
    color: #7d8972;
    font-size: 9px;
    white-space: nowrap;
  }
  .sender-line {
    padding: 22px 26px;
    display: flex;
    gap: 11px;
    align-items: center;
  }
  .avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #ecefdf;
    color: #6b7b51;
    display: grid;
    place-items: center;
    font-family: var(--serif);
    font-size: 17px;
    flex-shrink: 0;
  }
  .sender-line > div {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .sender-line strong {
    font-size: 12px;
    font-weight: 600;
  }
  .sender-line div > span {
    font-size: 10px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .gmail-badge {
    font-size: 9px;
    color: #8a9085;
    margin-left: auto;
    white-space: nowrap;
  }
  .subject-label {
    font-size: 10px;
    color: #929888;
    margin: 0 26px;
  }
  .subject-input {
    border: 0;
    border-bottom: 1px solid #eff1eb;
    border-radius: 0;
    width: calc(100% - 52px);
    margin: 0 26px;
    padding: 5px 0 17px;
    font-size: 14px;
    font-weight: 500;
  }
  .message-input {
    display: block;
    border: 0;
    border-radius: 0;
    margin: 12px 26px 0;
    padding: 10px 0;
    width: calc(100% - 52px);
    min-height: 300px;
    font-size: 13px;
    line-height: 1.95;
    resize: vertical;
  }
  .email-tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 26px 17px;
    color: #9ba18f;
    font-size: 9px;
  }
  .email-tools .status-dot {
    width: 4px;
    height: 4px;
    margin-right: 4px;
  }
  .email-tools .text-button {
    font-size: 10px;
    color: #89927e;
  }
  .send-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: #fbfcf8;
    border-top: 1px solid var(--border);
    padding: 21px 26px;
  }
  .send-footer p {
    font-size: 10px;
    color: #8e9586;
    line-height: 1.8;
  }
  .send-footer strong {
    font-weight: 400;
    color: #6a7660;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 23px;
    min-height: 47px;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 11px 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .primary {
    background: var(--green);
    color: white;
  }
  .primary:hover:not(:disabled) {
    background: var(--green-dark);
  }
  .button > span {
    font-size: 20px;
    line-height: 1;
  }
  .secondary {
    background: #fff;
    border-color: var(--border);
    color: var(--green);
  }
  .page-footer {
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 34px 0 0;
    padding: 22px 0 30px;
    color: #919988;
    font-size: 10px;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 24px;
  }
  .settings-card,
  .activity-card {
    padding: 30px;
  }
  .settings-card h2,
  .activity-card h2 {
    margin: 12px 0 8px;
  }
  .settings-card textarea {
    font-size: 14px;
    line-height: 1.7;
  }
  .settings-card .button {
    margin-top: 20px;
  }
  code {
    font-size: 11px;
    color: var(--green);
    background: var(--soft);
    padding: 2px 4px;
    border-radius: 3px;
  }
  .saved-resume {
    font-size: 13px;
    margin: 20px 0;
    overflow-wrap: anywhere;
  }
  .upload-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    border: 1px dashed #cbd6c1;
    background: #fafbf7;
    border-radius: 8px;
    padding: 22px 14px;
    text-align: center;
  }
  .upload-area > span {
    font-size: 27px;
  }
  .upload-area small {
    font-weight: 400;
    color: var(--muted);
  }
  .upload-area input {
    font-size: 12px;
    margin-top: 10px;
    padding: 7px;
    background: transparent;
    border: 0;
  }
  .danger {
    color: #9c5647;
  }
  .privacy-card {
    padding: 25px 15px;
  }
  .privacy-card p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.8;
  }
  .notice,
  .demo-banner {
    padding: 13px 16px;
    border: 1px solid #d3dfc7;
    background: #edf3e7;
    color: #44603a;
    font-size: 12px;
    border-radius: 8px;
    margin: 18px 0;
  }
  .notice.error {
    background: #fff3e9;
    border-color: #eed8c6;
    color: #825437;
  }
  .loading {
    padding: 60px;
    text-align: center;
    color: var(--muted);
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .history-item:last-child {
    border: 0;
  }
  .history-item strong {
    display: block;
    font-size: 13px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .history-item p,
  .history-item time {
    font-size: 11px;
    color: var(--muted);
  }
  .history-item .history-status {
    font-size: 11px;
    color: var(--green);
    white-space: nowrap;
  }
  .history-item .uncertain {
    color: #966d37;
  }
  .empty-state {
    padding: 45px 10px;
    text-align: center;
    color: var(--muted);
  }
  dialog {
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 0;
    width: min(650px, calc(100% - 24px));
    max-height: 90dvh;
    color: var(--ink);
    box-shadow: 0 24px 100px #1d302933;
  }
  dialog::backdrop {
    background: #263a3466;
    backdrop-filter: blur(3px);
  }
  .dialog-header {
    padding: 24px;
    display: flex;
    gap: 16px;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .dialog-header h2 {
    font-size: 25px;
  }
  .dialog-header .eyebrow {
    margin-bottom: 7px;
  }
  .close-button {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 28px;
    min-width: 40px;
    min-height: 40px;
    align-self: start;
  }
  .review-content {
    padding: 24px;
  }
  .review-details {
    margin: 0;
  }
  .review-details > div {
    display: flex;
    gap: 14px;
    margin-bottom: 9px;
    font-size: 12px;
  }
  .review-details dt {
    width: 48px;
    flex-shrink: 0;
    color: var(--muted);
  }
  .review-details dd {
    margin: 0;
    overflow-wrap: anywhere;
  }
  #review-body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: inherit;
    font-size: 14px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
    line-height: 1.9;
  }
  .review-attachment {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--paper);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .dialog-footer {
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    bottom: 0;
    background: white;
  }
  #send-status {
    margin-top: 12px;
    font-size: 12px;
    color: #825437;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (min-width: 1400px) {
    .app-shell {
      padding: 0 30px;
    }
    .page-heading {
      padding-top: 60px;
      padding-bottom: 43px;
    }
  }
  @media (max-width: 850px) {
    .app-shell {
      padding: 0 25px;
    }
    .compose-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 16px;
    }
    .recipient-card,
    .resume-card {
      padding: 21px;
    }
    .field-row {
      grid-template-columns: 1fr;
      gap: 0;
    }
    .email-card-heading,
    .sender-line,
    .send-footer {
      padding: 20px;
    }
    .editable-badge {
      display: none;
    }
    .send-footer {
      align-items: stretch;
      flex-direction: column;
    }
    .send-footer p {
      display: none;
    }
    .chapter-art {
      margin-right: 0;
    }
    .settings-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
  @media (max-width: 620px) {
    .app-shell {
      padding: 0 20px;
    }
    .topbar {
      height: 76px;
    }
    .brand {
      font-size: 24px;
    }
    .private-label {
      font-size: 0;
      gap: 0;
    }
    .private-label .status-dot {
      width: 7px;
      height: 7px;
    }
    .page-heading {
      padding: 31px 0 24px;
    }
    .eyebrow {
      font-size: 8px;
      letter-spacing: 1.25px;
      max-width: 270px;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 37px;
      letter-spacing: -1.2px;
    }
    .intro {
      font-size: 12px;
      max-width: 275px;
      line-height: 1.7;
      margin-top: 14px;
    }
    .chapter-art {
      display: none;
    }
    .tabs {
      gap: 25px;
      margin-bottom: 20px;
    }
    .tab {
      font-size: 12px;
    }
    .compose-grid,
    .settings-grid {
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .field-row {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .recipient-card {
      padding: 22px;
    }
    .recipient-card h2 {
      font-size: 23px;
      margin-top: 16px;
    }
    .quiet-note {
      display: none;
    }
    .resume-card {
      margin-top: 14px;
      padding: 15px 22px;
    }
    .file-row {
      padding: 10px 0 13px;
    }
    .email-card-heading {
      padding: 19px 22px;
    }
    .editable-badge {
      display: block;
    }
    .sender-line {
      padding: 19px 22px;
    }
    .subject-input {
      font-size: 16px;
    }
    .message-input {
      font-size: 16px;
      line-height: 1.8;
      min-height: 365px;
    }
    .send-footer {
      padding: 19px 22px;
    }
    .send-footer .button {
      width: 100%;
      min-height: 50px;
    }
    .email-tools {
      padding: 8px 22px 12px;
      flex-wrap: wrap;
    }
    .page-footer {
      font-size: 9px;
      margin-top: 25px;
      flex-wrap: wrap;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .settings-card,
    .activity-card {
      padding: 22px;
    }
    .settings-card textarea {
      font-size: 16px;
    }
    .dialog-header,
    .review-content {
      padding: 20px;
    }
    .dialog-header h2 {
      font-size: 24px;
    }
    .dialog-footer {
      padding: 16px;
